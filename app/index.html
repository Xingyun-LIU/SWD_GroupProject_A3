<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course Selection System</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a12;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent1: #7c6dfa;
      --accent2: #f97ece;
      --accent3: #4de8c2;
      --text: #f0eeff;
      --muted: rgba(240,238,255,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated mesh background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%,  rgba(124,109,250,0.28) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 80%,  rgba(249,126,206,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 55% 45%,  rgba(77,232,194,0.15) 0%, transparent 55%);
      animation: bgShift 12s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes bgShift {
      from { transform: scale(1) rotate(0deg); }
      to   { transform: scale(1.08) rotate(2deg); }
    }

    /* ── Noise grain overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none; z-index: 1; opacity: .5;
    }

    /* ── Floating orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.18;
      animation: float 20s ease-in-out infinite;
      z-index: 0;
    }
    .orb1 { width: 400px; height: 400px; background: var(--accent1); top: -10%; left: -8%; animation-duration: 18s; }
    .orb2 { width: 350px; height: 350px; background: var(--accent2); bottom: -5%; right: -5%; animation-duration: 24s; animation-delay: -8s; }
    .orb3 { width: 250px; height: 250px; background: var(--accent3); top: 55%; left: 60%; animation-duration: 20s; animation-delay: -14s; }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(30px,-40px) scale(1.05); }
      66%      { transform: translate(-20px, 25px) scale(0.95); }
    }

    /* ── Card ── */
    .card {
      position: relative; z-index: 2;
      width: min(520px, 92vw);
      padding: 56px 48px 60px;
      background: rgba(15,14,28,0.72);
      border: 1px solid var(--border);
      border-radius: 32px;
      backdrop-filter: blur(28px);
      box-shadow:
        0 0 0 1px rgba(124,109,250,0.12),
        0 40px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.07);
      animation: cardIn .9s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(36px) scale(.97); }
      to   { opacity:1; transform: translateY(0)    scale(1); }
    }

    /* ── Header ── */
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent3);
      background: rgba(77,232,194,0.1);
      border: 1px solid rgba(77,232,194,0.25);
      border-radius: 99px;
      padding: 4px 14px;
      margin-bottom: 20px;
      animation: cardIn .9s .1s cubic-bezier(.16,1,.3,1) both;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 8vw, 56px);
      font-weight: 900;
      line-height: 1.05;
      color: var(--text);
      letter-spacing: -.02em;
      animation: cardIn .9s .15s cubic-bezier(.16,1,.3,1) both;
    }
    h1 span {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      animation: cardIn .9s .2s cubic-bezier(.16,1,.3,1) both;
    }

    /* ── Divider ── */
    .divider {
      width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 30%, var(--border) 70%, transparent);
      margin: 36px 0 32px;
      animation: cardIn .9s .25s cubic-bezier(.16,1,.3,1) both;
    }

    /* ── Nav buttons ── */
    .nav-list { display: flex; flex-direction: column; gap: 14px; }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all .35s cubic-bezier(.16,1,.3,1);
      position: relative;
      overflow: hidden;
      animation: cardIn .9s both;
    }
    .nav-btn:nth-child(1) { animation-delay: .3s; }
    .nav-btn:nth-child(2) { animation-delay: .38s; }
    .nav-btn:nth-child(3) { animation-delay: .46s; }
    .nav-btn:nth-child(4) { animation-delay: .54s; }

    /* shimmer on hover */
    .nav-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.06) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform .55s ease;
    }
    .nav-btn:hover::before { transform: translateX(100%); }

    /* colored left glow per button */
    .nav-btn::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 99px;
      opacity: 0;
      transition: opacity .3s;
    }
    .nav-btn:hover::after { opacity: 1; }
    .nav-btn.add::after    { background: var(--accent3); box-shadow: 0 0 12px var(--accent3); }
    .nav-btn.search::after { background: var(--accent1); box-shadow: 0 0 12px var(--accent1); }
    .nav-btn.update::after { background: #fbbf24;         box-shadow: 0 0 12px #fbbf24; }
    .nav-btn.delete::after { background: #f87171;         box-shadow: 0 0 12px #f87171; }

    .nav-btn:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.16);
      transform: translateX(4px) scale(1.01);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .btn-left { display: flex; align-items: center; gap: 14px; }

    .btn-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .add    .btn-icon { background: rgba(77,232,194,0.12);  }
    .search .btn-icon { background: rgba(124,109,250,0.12); }
    .update .btn-icon { background: rgba(251,191,36,0.12);  }
    .delete .btn-icon { background: rgba(248,113,113,0.12); }

    .btn-arrow {
      font-size: 18px;
      opacity: .35;
      transition: opacity .3s, transform .3s;
    }
    .nav-btn:hover .btn-arrow { opacity: .9; transform: translateX(4px); }

    /* ── Footer ── */
    .footer {
      margin-top: 36px;
      text-align: center;
      font-size: 12px;
      color: rgba(240,238,255,0.2);
      letter-spacing: .06em;
      animation: cardIn .9s .6s cubic-bezier(.16,1,.3,1) both;
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="card">
    <div class="badge">✦ Academic Portal</div>
    <h1>Course<br/><span>Selection</span></h1>
    <p class="subtitle">Manage your academic courses with precision and ease.</p>

    <div class="divider"></div>

    <nav class="nav-list">
      <a href="add-course.html" class="nav-btn add">
        <div class="btn-left">
          <div class="btn-icon">＋</div>
          <span>Add Course</span>
        </div>
        <span class="btn-arrow">→</span>
      </a>
      <a href="search-course.html" class="nav-btn search">
        <div class="btn-left">
          <div class="btn-icon">🔍</div>
          <span>Search Course</span>
        </div>
        <span class="btn-arrow">→</span>
      </a>
      <a href="update-course.html" class="nav-btn update">
        <div class="btn-left">
          <div class="btn-icon">✎</div>
          <span>Update Course</span>
        </div>
        <span class="btn-arrow">→</span>
      </a>
      <a href="delete-course.html" class="nav-btn delete">
        <div class="btn-left">
          <div class="btn-icon">✕</div>
          <span>Delete Course</span>
        </div>
        <span class="btn-arrow">→</span>
      </a>
    </nav>

    <div class="footer">COURSE SELECTION SYSTEM &nbsp;·&nbsp; v2.0</div>
  </div>
</body>
</html>
