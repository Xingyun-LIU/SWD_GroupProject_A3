<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Course</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a12;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #7c6dfa;
      --accent-glow: rgba(124,109,250,0.25);
      --text: #f0eeff;
      --muted: rgba(240,238,255,0.45);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 32px 16px 48px;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 80% 10%, rgba(124,109,250,0.2) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 20% 90%, rgba(249,126,206,0.12) 0%, transparent 55%);
      z-index: 0;
    }

    .card {
      position: relative; z-index: 2;
      width: min(600px, 96vw);
      background: rgba(15,14,28,0.80);
      border: 1px solid var(--border);
      border-radius: 32px;
      backdrop-filter: blur(28px);
      box-shadow: 0 0 0 1px rgba(124,109,250,0.1), 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.07);
      padding: 48px 44px 52px;
      animation: cardIn .8s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:none} }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--muted); text-decoration: none;
      margin-bottom: 32px; transition: color .2s;
    }
    .back-link:hover { color: var(--accent); }

    .page-badge {
      display: inline-block; font-size: 11px; font-weight: 500;
      letter-spacing: .15em; text-transform: uppercase;
      color: var(--accent);
      background: rgba(124,109,250,0.1);
      border: 1px solid rgba(124,109,250,0.25);
      border-radius: 99px; padding: 4px 14px; margin-bottom: 16px;
    }

    h1 { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 900; color: var(--text); letter-spacing: -.02em; margin-bottom: 8px; }
    h1 span { color: var(--accent); }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 32px; }

    /* Search bar */
    .search-wrap {
      position: relative; margin-bottom: 20px;
    }
    .search-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 56px 16px 52px;
      font-family: 'DM Sans', sans-serif; font-size: 16px; color: var(--text);
      outline: none; transition: all .25s;
    }
    .search-wrap input::placeholder { color: rgba(240,238,255,0.25); }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: rgba(124,109,250,0.05);
    }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: .5; }
    .search-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: var(--accent); border: none; border-radius: 10px;
      padding: 8px 18px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      color: #fff; cursor: pointer; transition: all .25s;
    }
    .search-btn:hover { background: #9584ff; box-shadow: 0 4px 16px var(--accent-glow); }

    /* Filters */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
    .filter-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 99px; padding: 6px 16px;
      font-size: 13px; color: var(--muted);
      cursor: pointer; transition: all .2s;
    }
    .filter-chip:hover, .filter-chip.active {
      background: rgba(124,109,250,0.12); border-color: var(--accent); color: var(--accent);
    }

    /* Results */
    .results-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; font-size: 13px; color: var(--muted);
    }

    .result-list { display: flex; flex-direction: column; gap: 12px; }

    .result-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 18px; padding: 18px 22px;
      transition: all .3s cubic-bezier(.16,1,.3,1);
      cursor: pointer;
    }
    .result-card:hover {
      background: rgba(124,109,250,0.07);
      border-color: rgba(124,109,250,0.3);
      transform: translateX(4px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.3), -4px 0 0 var(--accent);
    }
    .rc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .rc-name { font-size: 16px; font-weight: 500; color: var(--text); }
    .rc-code {
      font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
      color: var(--accent); background: rgba(124,109,250,0.12);
      border-radius: 8px; padding: 3px 10px;
    }
    .rc-meta { font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
    .rc-meta span::before { margin-right: 4px; opacity: .6; }

    .empty-state { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="back-link">← Back to Home</a>
    <div class="page-badge">🔍 Discovery</div>
    <h1>Search <span>Course</span></h1>
    <p class="subtitle">Find any course by name, code, or department.</p>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search by course name or code…" oninput="handleSearch()"/>
      <button class="search-btn" onclick="handleSearch()">Search</button>
    </div>

    <div class="filters">
      <div class="filter-chip active" onclick="setFilter(this,'all')">All</div>
      <div class="filter-chip" onclick="setFilter(this,'cs')">Computer Science</div>
      <div class="filter-chip" onclick="setFilter(this,'math')">Mathematics</div>
      <div class="filter-chip" onclick="setFilter(this,'phys')">Physics</div>
      <div class="filter-chip" onclick="setFilter(this,'biz')">Business</div>
    </div>

    <div class="results-header">
      <span id="resultCount">4 courses found</span>
      <span>Sort: Relevance</span>
    </div>

    <div class="result-list" id="resultList"></div>
  </div>

  <script>
    const courses = [
      { name: 'Introduction to Computer Science', code: 'CS101', dept: 'cs', instructor: 'Dr. Sarah Chen', credits: 3, semester: 'Fall 2025' },
      { name: 'Data Structures & Algorithms', code: 'CS201', dept: 'cs', instructor: 'Prof. James Liu', credits: 4, semester: 'Spring 2026' },
      { name: 'Calculus I', code: 'MA101', dept: 'math', instructor: 'Dr. Emily Park', credits: 3, semester: 'Fall 2025' },
      { name: 'Quantum Mechanics', code: 'PH301', dept: 'phys', instructor: 'Prof. Alex Kim', credits: 4, semester: 'Spring 2026' },
      { name: 'Business Strategy', code: 'BZ201', dept: 'biz', instructor: 'Dr. Mia Santos', credits: 3, semester: 'Fall 2025' },
      { name: 'Linear Algebra', code: 'MA201', dept: 'math', instructor: 'Prof. Raj Patel', credits: 3, semester: 'Spring 2026' },
    ];

    let currentFilter = 'all';

    function setFilter(el, f) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active'); currentFilter = f; render();
    }

    function handleSearch() { render(); }

    function render() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = courses.filter(c => {
        const matchFilter = currentFilter === 'all' || c.dept === currentFilter;
        const matchSearch = !q || c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q);
        return matchFilter && matchSearch;
      });
      document.getElementById('resultCount').textContent = `${filtered.length} course${filtered.length !== 1 ? 's' : ''} found`;
      const list = document.getElementById('resultList');
      if (!filtered.length) {
        list.innerHTML = '<div class="empty-state">No courses match your search.</div>'; return;
      }
      list.innerHTML = filtered.map(c => `
        <div class="result-card">
          <div class="rc-top"><span class="rc-name">${c.name}</span><span class="rc-code">${c.code}</span></div>
          <div class="rc-meta">
            <span>👤 ${c.instructor}</span>
            <span>📚 ${c.credits} Credits</span>
            <span>🗓 ${c.semester}</span>
          </div>
        </div>`).join('');
    }
    render();
  </script>
</body>
</html>
