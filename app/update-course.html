<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Update Course</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a12;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #fbbf24;
      --accent-glow: rgba(251,191,36,0.22);
      --text: #f0eeff;
      --muted: rgba(240,238,255,0.45);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 32px 16px 48px; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 15% 5%,  rgba(251,191,36,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 85% 95%, rgba(124,109,250,0.12) 0%, transparent 55%);
      z-index: 0;
    }

    .card {
      position: relative; z-index: 2;
      width: min(580px, 96vw);
      background: rgba(15,14,28,0.80);
      border: 1px solid var(--border);
      border-radius: 32px;
      backdrop-filter: blur(28px);
      box-shadow: 0 0 0 1px rgba(251,191,36,0.1), 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.07);
      padding: 48px 44px 52px;
      animation: cardIn .8s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:none} }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--muted); text-decoration: none;
      margin-bottom: 32px; transition: color .2s;
    }
    .back-link:hover { color: var(--accent); }

    .page-badge {
      display: inline-block; font-size: 11px; font-weight: 500;
      letter-spacing: .15em; text-transform: uppercase;
      color: var(--accent); background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.25);
      border-radius: 99px; padding: 4px 14px; margin-bottom: 16px;
    }

    h1 { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 900; color: var(--text); letter-spacing: -.02em; margin-bottom: 8px; }
    h1 span { color: var(--accent); }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 32px; }

    /* Step 1: lookup */
    .lookup-wrap {
      display: flex; gap: 12px; margin-bottom: 32px;
    }
    .lookup-wrap input {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 18px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text);
      outline: none; transition: all .25s;
    }
    .lookup-wrap input::placeholder { color: rgba(240,238,255,0.25); }
    .lookup-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .lookup-btn {
      background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3);
      border-radius: 14px; padding: 14px 22px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      color: var(--accent); cursor: pointer; transition: all .25s; white-space: nowrap;
    }
    .lookup-btn:hover { background: rgba(251,191,36,0.25); }

    /* Edit form */
    .edit-section { display: none; }
    .edit-section.visible { display: block; }

    .found-banner {
      background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2);
      border-radius: 14px; padding: 14px 18px;
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: var(--accent); margin-bottom: 24px;
    }

    .form-grid { display: flex; flex-direction: column; gap: 18px; }

    .field label {
      display: block; font-size: 12px; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    }
    .field input, .field select, .field textarea {
      width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 18px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text);
      outline: none; transition: all .25s;
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field input::placeholder { color: rgba(240,238,255,0.25); }
    .field select option { background: #1a1828; }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .btn-row { display: flex; gap: 12px; margin-top: 8px; }
    .cancel-btn {
      flex: 1; padding: 14px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      color: var(--muted); cursor: pointer; transition: all .25s;
    }
    .cancel-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

    .update-btn {
      flex: 2; padding: 14px;
      background: linear-gradient(135deg, var(--accent), #f59e0b);
      border: none; border-radius: 14px;
      font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 500;
      color: #0a0a12; cursor: pointer; transition: all .3s cubic-bezier(.16,1,.3,1);
      box-shadow: 0 4px 24px rgba(251,191,36,0.3); position: relative; overflow: hidden;
    }
    .update-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
      transform: translateX(-100%); transition: transform .5s;
    }
    .update-btn:hover::before { transform: translateX(100%); }
    .update-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 36px rgba(251,191,36,0.45); }

    .toast {
      display: none; margin-top: 14px;
      background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3);
      border-radius: 12px; padding: 12px 18px;
      color: var(--accent); font-size: 14px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="back-link">← Back to Home</a>
    <div class="page-badge">✎ Edit Mode</div>
    <h1>Update <span>Course</span></h1>
    <p class="subtitle">Enter a course code to load and edit its details.</p>

    <div class="lookup-wrap">
      <input type="text" id="lookupInput" placeholder="Enter course code, e.g. CS101"/>
      <button class="lookup-btn" onclick="lookupCourse()">Load Course</button>
    </div>

    <div class="edit-section" id="editSection">
      <div class="found-banner">✓ Course found — edit the fields below and save changes.</div>
      <div class="form-grid">
        <div class="field">
          <label>Course Name</label>
          <input type="text" id="f-name" value="Introduction to Computer Science"/>
        </div>
        <div class="row-2">
          <div class="field">
            <label>Course Code</label>
            <input type="text" id="f-code" value="CS101"/>
          </div>
          <div class="field">
            <label>Credits</label>
            <input type="number" id="f-credits" value="3"/>
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label>Department</label>
            <select>
              <option selected>Computer Science</option>
              <option>Mathematics</option>
              <option>Physics</option>
              <option>Business</option>
            </select>
          </div>
          <div class="field">
            <label>Semester</label>
            <select>
              <option>Spring 2025</option>
              <option selected>Fall 2025</option>
              <option>Spring 2026</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Instructor</label>
          <input type="text" value="Dr. Sarah Chen"/>
        </div>
        <div class="field">
          <label>Description</label>
          <textarea>An introductory course covering fundamental concepts of computer science including algorithms, data structures, and programming paradigms.</textarea>
        </div>
        <div class="btn-row">
          <button class="cancel-btn" onclick="cancelEdit()">Cancel</button>
          <button class="update-btn" onclick="saveUpdate()">Save Changes →</button>
        </div>
        <div class="toast" id="toast">✓ Course updated successfully!</div>
      </div>
    </div>
  </div>

  <script>
    function lookupCourse() {
      const v = document.getElementById('lookupInput').value.trim();
      if (!v) return;
      document.getElementById('editSection').classList.add('visible');
    }
    function cancelEdit() {
      document.getElementById('editSection').classList.remove('visible');
      document.getElementById('lookupInput').value = '';
    }
    function saveUpdate() {
      const t = document.getElementById('toast');
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
  </script>
</body>
</html>
