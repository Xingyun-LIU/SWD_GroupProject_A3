<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Course</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a12;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #4de8c2;
      --accent-glow: rgba(77,232,194,0.25);
      --text: #f0eeff;
      --muted: rgba(240,238,255,0.45);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 10% 0%,  rgba(77,232,194,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 90% 100%, rgba(124,109,250,0.15) 0%, transparent 55%);
      z-index: 0;
    }

    .card {
      position: relative; z-index: 2;
      width: min(560px, 96vw);
      background: rgba(15,14,28,0.80);
      border: 1px solid var(--border);
      border-radius: 32px;
      backdrop-filter: blur(28px);
      box-shadow: 0 0 0 1px rgba(77,232,194,0.1), 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.07);
      padding: 48px 44px 52px;
      animation: cardIn .8s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:none} }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--muted);
      text-decoration: none;
      margin-bottom: 32px;
      transition: color .2s;
    }
    .back-link:hover { color: var(--accent); }

    .page-badge {
      display: inline-block;
      font-size: 11px; font-weight: 500; letter-spacing: .15em; text-transform: uppercase;
      color: var(--accent);
      background: rgba(77,232,194,0.1);
      border: 1px solid rgba(77,232,194,0.25);
      border-radius: 99px; padding: 4px 14px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px; font-weight: 900;
      color: var(--text); letter-spacing: -.02em;
      margin-bottom: 8px;
    }
    h1 span { color: var(--accent); }

    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 36px; }

    .form-grid { display: flex; flex-direction: column; gap: 20px; }

    .field label {
      display: block; font-size: 12px; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; color: var(--text);
      outline: none;
      transition: border-color .25s, box-shadow .25s, background .25s;
    }
    .field textarea { resize: vertical; min-height: 90px; }
    .field input::placeholder, .field textarea::placeholder { color: rgba(240,238,255,0.2); }
    .field select option { background: #1a1828; }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: rgba(77,232,194,0.04);
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .submit-btn {
      width: 100%; margin-top: 8px;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), #22c9a0);
      border: none; border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px; font-weight: 500;
      color: #0a0a12;
      cursor: pointer;
      transition: all .3s cubic-bezier(.16,1,.3,1);
      box-shadow: 0 4px 24px rgba(77,232,194,0.3);
      position: relative; overflow: hidden;
    }
    .submit-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
      transform: translateX(-100%); transition: transform .5s;
    }
    .submit-btn:hover::before { transform: translateX(100%); }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 36px rgba(77,232,194,0.45); }
    .submit-btn:active { transform: translateY(0); }

    /* success toast */
    .toast {
      display: none; margin-top: 14px;
      background: rgba(77,232,194,0.1); border: 1px solid rgba(77,232,194,0.3);
      border-radius: 12px; padding: 12px 18px;
      color: var(--accent); font-size: 14px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="back-link">← Back to Home</a>
    <div class="page-badge">✦ New Entry</div>
    <h1>Add <span>Course</span></h1>
    <p class="subtitle">Fill in the details below to register a new course.</p>

    <div class="form-grid">
      <div class="field">
        <label>Course Name</label>
        <input type="text" placeholder="e.g. Introduction to Computer Science"/>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Course Code</label>
          <input type="text" placeholder="e.g. CS101"/>
        </div>
        <div class="field">
          <label>Credits</label>
          <input type="number" placeholder="e.g. 3" min="1" max="10"/>
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Department</label>
          <select>
            <option value="">Select department</option>
            <option>Computer Science</option>
            <option>Mathematics</option>
            <option>Physics</option>
            <option>Business</option>
            <option>Engineering</option>
          </select>
        </div>
        <div class="field">
          <label>Semester</label>
          <select>
            <option value="">Select semester</option>
            <option>Spring 2025</option>
            <option>Fall 2025</option>
            <option>Spring 2026</option>
            <option>Fall 2026</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Instructor</label>
        <input type="text" placeholder="e.g. Dr. Sarah Chen"/>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea placeholder="Brief course description…"></textarea>
      </div>
      <button class="submit-btn" onclick="handleSubmit()">Add Course →</button>
      <div class="toast" id="toast">✓ Course added successfully!</div>
    </div>
  </div>
  <script>
    function handleSubmit() {
      const t = document.getElementById('toast');
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
  </script>
</body>
</html>
